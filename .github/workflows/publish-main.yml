name: Publish main

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build and push images
    runs-on: namespace-profile-yo-lo
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Every image name and tag comes from the Makefile (GIT_TAG → IMAGE_TAG,
      # docs/VERSIONING.md), so CI reuses it instead of re-deriving the rule
      # with docker/metadata-action. Off a version tag that is sha-<short
      # hash> — the same spelling metadata-action's type=sha publishes for the
      # sibling project, so `make`, tests/e2e.sh and CI agree on the name.
      #
      # `make push` builds the OpenLDAP 2.7.1 .deb carrier once and feeds it
      # to both 2.7 images from local storage (it is never pushed); the
      # Makefile drives podman for that.
      - name: Show the tag the Makefile derived
        run: make show-tag

      # The Makefile defaults REGISTRY to the upstream owner; a fork publishes
      # under its own, lowercased because OCI repository names must be.
      - name: Point REGISTRY at the repository owner
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # The Namespace runner image ships no podman, and the Makefile drives it.
      # Its root filesystem is an overlayfs, which rootless podman's native
      # overlay driver cannot stack on, so storage goes through fuse-overlayfs.
      # Its /proc/sys is read-only, so podman must not set its default
      # net.ipv4.ping_group_range sysctl in every build container.
      - name: Install podman
        run: |
          sudo apt-get update && sudo apt-get install -y podman fuse-overlayfs
          mkdir -p ~/.config/containers
          printf '[storage]\ndriver = "overlay"\n[storage.options.overlay]\nmount_program = "/usr/bin/fuse-overlayfs"\n' \
            > ~/.config/containers/storage.conf
          printf '[containers]\ndefault_sysctls = []\n' > ~/.config/containers/containers.conf

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push the six images
        run: make push
