name: Tests

# push is limited to main: a PR branch is covered by the pull_request event,
# and running both doubles every check.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels the run it replaces. Every other event gets a
# group of its own, so runs on main never wait for or cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      # The repo root has no go.mod: the operator (operator/), the slapd
      # exporter (exporter/) and the Ginkgo e2e suite (tests/e2e/) are separate
      # modules. They declare the same Go version; the operator's is used here.
      - name: Setup Go
        id: go
        uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache: false

      # Without the caches the job compiles every dependency and reruns every
      # test (254 s against 52 s). Every run reads them, only main writes them,
      # so pull requests add no copies to the 10 GB cache.
      - name: Restore the Go caches
        id: gocache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: test-go-${{ steps.go.outputs.go-version }}-${{ hashFiles('operator/go.sum', 'exporter/go.sum', 'tests/e2e/go.sum') }}
          restore-keys: test-go-${{ steps.go.outputs.go-version }}-

      # `make tidy` is the one list of modules; dependabot-tidy.yml runs the
      # same target to finish a Dependabot bump, so the two cannot disagree.
      - name: Check tidy
        run: |
          make tidy
          git diff --exit-code -- operator/go.mod operator/go.sum exporter/go.mod exporter/go.sum tests/e2e/go.mod tests/e2e/go.sum

      # Same class of check as `go mod tidy` above: the repo carries generated
      # files (CRDs, the RBAC role, zz_generated.deepcopy.go and the operator
      # chart's copy of the CRDs) that nothing used to verify — edit a
      # kubebuilder marker, forget `make operator-manifests operator-generate`,
      # and CI stayed green on a stale tree.
      - name: Check generated files are up to date
        run: make verify-generated

      # envtest: the operator Makefile downloads the control-plane binaries for
      # the Kubernetes minor that operator/go.mod pins.
      - name: Run unit tests
        run: make -C operator test

      # The exporter is its own module and image (ADR-033 decision 4); its
      # tests need no cluster and no envtest.
      - name: Vet and test the exporter
        run: cd exporter && go vet ./... && go test ./...

      # The init container's converger (ADR-034) decides offline, before slapd
      # runs, whether to rewrite a pod's cn=config — so its decision table is
      # unit-tested from real `slapcat -n 0` fixtures. Standard library only.
      - name: Run slapd-init unit tests
        run: make test-init

      # The e2e suite only runs against a lab cluster with NodePort access
      # (tests/README.md), which CI does not have — but CI can refuse a suite
      # that no longer compiles against the API types it exercises.
      - name: Compile the e2e suite
        run: cd tests/e2e && go vet ./...

      - name: Save the Go caches
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.gocache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.gocache.outputs.cache-primary-key }}
