# Turning the ADR-037 purge rotation on, for a mesh.
#
# An OVERLAY, not a second mesh: stack it on top of a complete values file so
# that the thing it demonstrates is the only thing it says.
#
#   helm upgrade --install ldap ./charts/slapd-mesh \
#     -n slaptain --create-namespace \
#     -f charts/slapd-mesh/examples/three-site.yaml \
#     -f charts/slapd-mesh/examples/rotation.yaml
#
# Applied UNCHANGED at every site, like everything else in this chart. The
# values below name no site, no endpoint and no pod — they are a schedule
# shape, and every site derives the same grid from the same cluster.replicas.
#
# What it does, at three sites of 2 read-write pods each (three-site.yaml):
# every pod's accesslog purge interval becomes 2 × 6h = 12h, pod 0 purges on
# the 12h grid and pod 1 six hours later, and each site publishes a
# slapd-write Service naming whichever of its two pods is not about to purge.
# Send WRITES to slapd-write; reads stay on slapd as before.
#
# Before you copy this, check the three prerequisites — a slapd image carrying
# the purge-phase patch (2.7.1-0+slaptain2 or later); clients whose connections
# are short-lived relative to slotLength; and a leadTime sized above those
# clients' maximum connection lifetime. The third is not optional: with the
# endpoint moving AT the slot boundary, a two-provider cluster under load
# measured 93,686 ops/s and 16.0M dropped iterations against 99,245 ops/s and
# 57,167 with a lead, at a worst-case write latency 59x higher. All three are
# spelled out in charts/slapd-mesh/values.yaml and in docs/PURGE-ROTATION.md,
# which carries the sizing arithmetic. The numbers below are illustrations, not
# recommendations: ADR-037 fixes none of them and neither does this file.

# One thing this overlay must NOT do: declare an interval. The schedule is the
# cluster's and it is declared ONCE, in one of two mutually exclusive forms —
# here (form B, staggered) or cluster.accesslogPurge.interval (form A, one
# schedule for everyone). Stacking this file on a values file that sets the
# other is refused by the operator, by name, as
# RotationConfigured=False/ScheduleDeclaredTwice. three-site.yaml sets none, so
# the stack above is clean.
#
# Each database still declares what it KEEPS
# (databases[].spec.replication.accesslogPurge.retention); that is the half
# that is genuinely per database, and it is untouched by this overlay.

cluster:
  rotation:
    enabled: true
    slotLength: "6h"
    # leadTime is d: how long BEFORE each slot boundary the write endpoint hands
    # over to the next pod, so that connections opened just before the handover
    # have aged out by the time the outgoing pod starts purging.
    #
    # 5m HERE IS AN ILLUSTRATION, NOT A RECOMMENDATION. Size it yourself: it
    # must sit above your clients' maximum connection lifetime τ — a client
    # property the operator cannot see — and below (replicas−1) × slotLength
    # minus the purge duration P = write_rate × replicas × slotLength /
    # delete_rate, which is a property of your write rate and your storage.
    # Measure your own delete rate at your own purge size; the upper bound
    # closes as the write rate rises, and a lead grown into stops protecting
    # silently. docs/PURGE-ROTATION.md works the arithmetic through.
    leadTime: "5m"
    # slotsFromWriteToPurge is deliberately absent: unset takes the operator's
    # 1 — "purge the slot after writing", which hands the endpoint on and then
    # immediately works the journal down. -1 is the other experiment ("purge
    # the slot before writing") and stays correct across a scale event, because
    # the value is read mod replicas. Set it only while measuring.
