{{- include "slapd-mesh.validate" . -}}
apiVersion: ldap.chuck-chuck-chuck.net/v1alpha1
kind: SlapdMesh
metadata:
  name: {{ .Values.mesh.name }}
  labels:
    {{- include "slapd-mesh.labels" . | nindent 4 }}
spec:
  sites:
    {{- range .Values.mesh.sites }}
    - name: {{ .name | quote }}
      serverIDIndex: {{ .serverIDIndex }}
      {{- with .endpoint }}
      endpoint: {{ . | quote }}
      {{- end }}
      {{- with .kubeconfigSecret }}
      {{- /* name is REQUIRED by the CRD, so emitting it empty produces an
             object the API server rejects — after it has been applied at every
             site. The whole field may be omitted (the operator then defaults to
             "<site>-kubeconfig"), but a half-filled one cannot be rescued:
             dropping it silently would discard a deliberate `key` override. */}}
      {{- if not .name }}
      {{- fail (printf "slapd-mesh: mesh.sites entry gives kubeconfigSecret without a name. Omit kubeconfigSecret entirely to take the default \"<site>-kubeconfig\", or name the Secret — an empty name is refused by the CRD, not defaulted.") }}
      {{- end }}
      kubeconfigSecret:
        name: {{ .name | quote }}
        {{- with .key }}
        key: {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- with .caSecretName }}
      caSecretName: {{ . | quote }}
      {{- end }}
    {{- end }}

  {{- /* ridLayout — the RID matrix's shape (ADR-031 decision 5). Mesh-scoped
         because every site must compute the same number for the same provider,
         so it is set ONCE here and applied unchanged everywhere, which is the
         parity the decision relies on this chart to provide. Omit it entirely
         to take the operator's defaults (podsPerSite 8, maxSites 12); a
         half-filled object is fine, since the API server defaults each axis
         on its own. Changing it renumbers the mesh — one cn=config write per
         pod per database, no restart and no resync. */}}
  {{- with .Values.mesh.ridLayout }}
  ridLayout:
    {{- with .podsPerSite }}
    podsPerSite: {{ . }}
    {{- end }}
    {{- with .maxSites }}
    maxSites: {{ . }}
    {{- end }}
  {{- end }}

  {{- with .Values.mesh.network }}
  network:
    {{- with .mode }}
    mode: {{ . | quote }}
    {{- end }}
    {{- with .multusNetwork }}
    multusNetwork: {{ . | quote }}
    {{- end }}
    {{- if hasKey . "useForInCluster" }}
    useForInCluster: {{ .useForInCluster }}
    {{- end }}
  {{- end }}

  {{- with .Values.mesh.trust }}
  {{- with .issuerRef }}
  trust:
    issuerRef:
      name: {{ .name | quote }}
      {{- with .kind }}
      kind: {{ . | quote }}
      {{- end }}
      {{- with .group }}
      group: {{ . | quote }}
      {{- end }}
  {{- end }}
  {{- end }}
