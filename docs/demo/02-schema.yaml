# A custom schema, applied by the operator to every pod.
apiVersion: ldap.chuck-chuck-chuck.net/v1alpha1
kind: SlapdSchema
metadata:
  name: demo-schema
  namespace: slaptain-demo
spec:
  clusterRef: slapd
  priority: 100
  attributeTypes:
    - >-
      ( 1.3.6.1.4.1.99999.1.1.1
        NAME 'demoContextId'
        DESC 'Numeric context identifier'
        EQUALITY integerMatch
        SYNTAX 1.3.6.1.4.1.1466.115.121.1.27
        SINGLE-VALUE )
    - >-
      ( 1.3.6.1.4.1.99999.1.1.3
        NAME 'demoQuota'
        DESC 'Storage quota in kilobytes'
        EQUALITY integerMatch
        SYNTAX 1.3.6.1.4.1.1466.115.121.1.27
        SINGLE-VALUE )
  objectClasses:
    - >-
      ( 1.3.6.1.4.1.99999.1.2.1
        NAME 'demoUser'
        DESC 'Demo application user with context and quota'
        SUP inetOrgPerson
        STRUCTURAL
        MAY ( demoContextId $ demoQuota ) )
