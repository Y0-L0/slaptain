# Reversible fault injection: take ONE site dark to inbound LDAP — including to
# its own operator.
#
#   make monitoring-demo-blackout CONTEXT=<site> SITE_POD_CIDR=<that site's pod CIDR>
#   make monitoring-demo-restore  CONTEXT=<site>
#
# VERIFIED on a three-site lab, 2026-10-06, 2.5 minutes. What it produces:
#
#   - the OTHER sites report this one Unreachable, with the verdict filled in.
#     They dialled and failed. This is the signal working — and with
#     monitoring site-local, it is the OTHER sites' Grafanas that show it: a
#     dark site is seen through its peers' operator judgments.
#   - this site's own Prometheus loses its slapd exporter targets (Surface 3):
#     scraping the sidecar is inbound to the slapd pod too, so expect
#     job="slapd-exporter" up == 0 here for the duration. (Expected from the
#     policy's shape; the 2026-10-06 run predates the PodMonitor.)
#   - this site reports PodsResponsive=False/PodsNotAnswering and
#     ReplicationConverged=Unknown/CSNQueriesIncomplete. Also working — and
#     note its pods stay Ready throughout, because the probes are exec probes
#     on loopback (ADR-030) and no network policy can touch them.
#   - this site reports a FILLED-IN verdict for both peers — it dials them even
#     though it cannot read its own databases. Expect Unreachable while the
#     policy is up (the cut is ingress-only, but the peers answer and this
#     site's own baseline is gone, so PartiallyVerified naming every database
#     is the other legitimate reading). What it must NOT produce is the old
#     shape: connected=false with an empty replicationState and no
#     lastChecked, a verdict on peers it never contacted. That was an operator
#     bug, fixed 2026-10-06 (docs/reconcile-loop-fixes.md, ADR-008 amendment);
#     this demo is its acceptance test, since the fix has no unit seam.
#     SlaptainPeerUnverified now only fires for a cluster with no databases.
#
# The ipBlock is doing less than it appears to. Cilium resolves in-cluster
# sources to their pod identity and only tests ipBlock against entities outside
# the cluster, so allowing the site's own pod CIDR allows nothing in-cluster and
# this is a deny-all-ingress. That is why it is named blackout and why there is
# a second file: monitoring/demo/cut-inbound.yaml uses fromEndpoints on the
# cluster label for a genuinely one-directional cut that leaves the local
# operator alone.
#
# The allowed CIDR is the ONE local fact here and is left as a placeholder, so
# this file cannot be applied blind — which for a fault injection is a feature.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: slaptain-demo-blackout
  namespace: slaptain-testing
  labels:
    app.kubernetes.io/part-of: slaptain
    slaptain.chuck-chuck-chuck.net/demo: blackout
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: slapd
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock:
            cidr: __SITE_POD_CIDR__
