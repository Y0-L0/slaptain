# kube-prometheus-stack values — APPLIED IDENTICALLY AT EVERY SITE.
#
# Monitoring is site-local (ADR-033 amendment 2026-10-09): each site's
# Prometheus scrapes only what runs at that site — its own kube-state-metrics
# (Surface 1), its own operator (Surface 2) and its own slapd exporter
# sidecars (Surface 3), all over ClusterIP via ServiceMonitor/PodMonitor.
# Nothing here reaches across a site boundary, and nothing here names a site:
# the Prometheus is the site. The only cross-site view is the one the operator
# already holds and exports locally (peer status, discovered providers).
#
#   helm install monitoring prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f monitoring/kube-prometheus-stack-values.yaml
#
# Install this FIRST at a site: it brings the Prometheus Operator CRDs the
# ServiceMonitors and the PodMonitor of the later releases need.
#
# Grafana: kubectl -n monitoring port-forward svc/monitoring-grafana 3000:80
# (or monitoring/gateway.yaml).

# We run kube-state-metrics ourselves, as its own release, from
# monitoring/kube-state-metrics-values.yaml: that release carries the
# custom-resource-state config that turns SlapdCluster/SlapdDatabase status
# into series, with its core collectors off. The bundled one would export core
# kinds and know nothing of slaptain's CRs.
kube-state-metrics:
  enabled: false
kubeStateMetrics:
  enabled: false

# Off, deliberately: this stack exists to show slaptain's own state. Node and
# control-plane metrics are a different conversation and a lot of series.
nodeExporter:
  enabled: false
prometheus-node-exporter:
  enabled: false
kubeApiServer:
  enabled: false
kubelet:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
coreDns:
  enabled: false

# Rules are shipped (monitoring/prometheus-rules.yaml) and visible as
# pending/firing in the Prometheus UI. Routing them somewhere is a decision
# about someone's on-call, not about slaptain.
alertmanager:
  enabled: false
defaultRules:
  create: false

prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    retention: 7d
    # Pick up PrometheusRules, ServiceMonitors and PodMonitors regardless of
    # release labels: the ksm ServiceMonitor and the operator chart's
    # ServiceMonitor and slapd PodMonitor belong to other releases.
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

grafana:
  enabled: true
  defaultDashboardsEnabled: false
  adminPassword: slaptain
  service:
    type: ClusterIP
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
