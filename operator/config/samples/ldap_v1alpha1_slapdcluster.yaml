# SlapdCluster — the slapd infrastructure: StatefulSet, Services, PVCs, TLS.
# Database-level configuration (suffix, ACLs, indices, seed) lives on
# SlapdDatabase and SlapdSchema CRs instead — see ADR-004 and the samples
# beside this one.
apiVersion: ldap.chuck-chuck-chuck.net/v1alpha1
kind: SlapdCluster
metadata:
  name: slapd
spec:
  # images is OPTIONAL. Omitted, the operator defaults both data-plane images to
  # its own registry path and tag, so a cluster tracks the operator it is
  # running under.
  #
  # To choose a DIFFERENT build, prefer select over typing a tag: it names what
  # the build governs rather than what it is called, and it drives BOTH images,
  # so a mismatched pair is not a state you can reach.
  # images:
  #   select:
  #     # What can open your volumes. lmdb1.0 = OpenLDAP 2.7 (default),
  #     # lmdb0.9 = 2.6. The two formats are mutually unreadable: changing this
  #     # on a POPULATED cluster is a dump-and-reload, not an upgrade. Read
  #     # docs/OPENLDAP-VERSIONS.md first.
  #     storageFormat: lmdb1.0
  #     # Whether the build carries slaptain's own behaviour patches.
  #     # pure (default) is upstream as our packaging builds it; slaptain is
  #     # needed only by spec.rotation's purge phases (docs/PURGE-ROTATION.md).
  #     # `slapd -VV` reports +pure<N> or +slaptain<N>, so you can check.
  #     flavour: pure
  #
  # An explicit tag still WINS over select and is used verbatim — pinning an
  # artifact means that artifact. Pin both or neither.
  #   slapd:
  #     repository: ghcr.io/chuck-chuck-chuck-net/slaptain/slapd
  #     tag: 0.5.0
  #     pullPolicy: IfNotPresent
  #   init:
  #     repository: ghcr.io/chuck-chuck-chuck-net/slaptain/slapd-init
  #     tag: 0.5.0
  #     pullPolicy: IfNotPresent

  ldap:
    # cnConfigCredentials:
    #   secretName: "my-config-credentials"  # optional; omit to auto-generate
    tls:
      enabled: true
      secretName: slapd-tls

  # Set replicas > 1 together with replication.enabled=true for N-way multi-master.
  replicas: 1
  # readReplicas: 0    # pure consumer pods in a second StatefulSet, <name>-readonly
  # logLevel is a slapd debug bitmask; omit for the default 16640 (stats+sync,
  # ADR-024). Set to 0 to silence slapd entirely.

  # Persistence is mandatory (ADR-013) — there is no `enabled` field. These are
  # the sizes, storage classes and access modes of the per-pod PVCs.
  persistence:
    config:
      size: 1Gi
      accessMode: ReadWriteOnce
    data:
      size: 5Gi
      accessMode: ReadWriteOnce
    accesslog:
      size: 1Gi
      accessMode: ReadWriteOnce

  service:
    type: ClusterIP
    ldapPort: 389
    ldapsPort: 636

  replication:
    enabled: false
  # To join a multi-site mesh, set meshRef instead of writing externalPeers by
  # hand: the operator then derives serverIDBase, the peer list, the network
  # mode and the trust wiring from the SlapdMesh plus its own siteName
  # (ADR-028; see ldap_v1alpha1_slapdmesh.yaml and docs/MULTI-SITE.md).
  # Setting a derived field alongside meshRef is refused, not silently ignored.
  # meshRef: slapd-mesh
  # sites: [site-a, site-b]   # optional subset of the mesh's sites
  #
  # Example 3-replica multi-master cluster:
  # replicas: 3
  # replication:
  #   enabled: true
  #   keepalive: "300:10:60"
  #   retry: "10 +"
  #
  # Example with Multus replication network (ADR-007):
  # replicas: 2
  # replication:
  #   enabled: true
  #   network:
  #     multusNetwork: "infra/replication-net"  # NAD reference (namespace/name)
  #     useForInCluster: false                  # optional: use Multus for in-cluster too
  #   externalPeers:
  #     - name: site-b
  #       podAddresses:                         # per-pod Multus IPs
  #         - "192.168.99.128"
  #         - "192.168.99.129"
  #       port: 1025
  #       tlsSecretName: "site-b-ca"
  #       bindDN: "cn=replication,dc=chuck-chuck-chuck,dc=net"
  #       bindPasswordSecretName: "shared-repl-creds"

  # WHEN the accesslog journals are purged. This is the CLUSTER's to decide —
  # a schedule is a property of the fleet, not of one database — while WHAT
  # each database keeps is on the SlapdDatabase (spec.replication.accesslogPurge).
  #
  # Exactly one of the two forms below. Setting both is REFUSED, never resolved
  # by precedence: RotationConfigured=False/ScheduleDeclaredTwice, with the
  # operator's 24h default still in force so nothing goes unpurged meanwhile.

  # Form A — one schedule, every pod purging together. Unset means 24h.
  # accesslogPurge:
  #   interval: 24h

  # Form B — the purge rotation (OPT-IN, docs/PURGE-ROTATION.md). Each pod
  # purges in its own slot and a <cluster>-write Service follows one slot
  # behind, so the pod taking writes is never the pod purging. A purge holds
  # the journal's single LMDB writer, which is the same writer client writes
  # need, so this is the difference between a periodic write stall and none.
  #
  # Read the guide before enabling: it only pays for clients that RE-DIAL (a
  # Service does not re-wire an established connection), and the sizing is
  # arithmetic for your own write rate.
  # rotation:
  #   enabled: true
  #   # Which halves run. Unset = PurgeAndWrite, the only shape measured end to
  #   # end. PurgeOnly staggers without moving the endpoint; WriteOnly moves
  #   # the endpoint without purge phases and is the one that works on a PURE
  #   # image. Both are ADR-039 tier 2.
  #   mode: PurgeAndWrite
  #   slotLength: 6h              # required when enabled; NO default
  #   leadTime: 180s              # move the endpoint this early; unset = 0
  #   # slotsFromWriteToPurge: 1  # leave alone unless you are measuring
  #
  # NOTE: the purge PHASE is a third field of olcAccessLogPurge that upstream
  # slapd rejects, so PurgeAndWrite and PurgeOnly need spec.images.select
  # .flavour: slaptain. A pure slapd keeps a bounded journal and the operator
  # reports AccesslogPurgeConverged=False/PurgePhaseUnsupported — the feature
  # degrades to "no rotation", never to "no purge".
